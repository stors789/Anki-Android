name: Deliver built AnkiDroid Music APK

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the successful build and publish the universal APK
        run: |
          gh run download 39922844674 --repo "$GITHUB_REPOSITORY" --name AnkiDroid-Music --dir artifacts
          mapfile -t apks < <(find artifacts -name '*universal*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" AnkiDroid-Music-2.25.3-universal.apk
          cat > release-notes.txt <<'NOTES'
          Personal build based on official AnkiDroid 2.25.3, with an optional audio focus switch.

          In Settings → Reviewing → Advanced, turn off Audio focus to play card audio without requesting audio focus from other apps.

          Package: com.ichi2.anki.music. Installs alongside the official app. Decks must be synced or imported separately.

          Built from f710d9aafd58c077eed9666cd7005907b29b08cd. Kotlin style checks, 21 regression tests, and release lint passed.

          Implementation assisted by Codex (GPT-6).
          NOTES
          gh release create music-2.25.3-r1 AnkiDroid-Music-2.25.3-universal.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target f710d9aafd58c077eed9666cd7005907b29b08cd \
            --title 'AnkiDroid Music 2.25.3 (personal build)' \
            --notes-file release-notes.txt
