name: Build AnkiDroid Music

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Configure local build
        run: |
          printf 'enable_coverage=false\nenable_leak_canary=false\n' > local.properties
      - name: Check Kotlin style and audio playback behavior
        run: |
          ./gradlew :AnkiDroid:ktlintCheck :AnkiDroid:testFullDebugUnitTest \
            --tests com.ichi2.anki.cardviewer.SoundTagPlayerTest \
            --tests com.ichi2.anki.cardviewer.CardMediaPlayerTest \
            --tests com.ichi2.anki.settings.PrefsRobolectricTest \
            --max-workers=2 --stacktrace
      - name: Build signed APKs
        env:
          AUDIO_FOCUS_KEYSTORE: ${{ secrets.AUDIO_FOCUS_KEYSTORE }}
          KEYSTOREPWD: ${{ secrets.AUDIO_FOCUS_KEYSTORE_PASSWORD }}
          KEYPWD: ${{ secrets.AUDIO_FOCUS_KEYSTORE_PASSWORD }}
          KEYALIAS: ankidroid-music
        run: |
          export KEYSTOREPATH="$RUNNER_TEMP/ankidroid-music.p12"
          printf '%s' "$AUDIO_FOCUS_KEYSTORE" | base64 --decode > "$KEYSTOREPATH"
          ./gradlew :AnkiDroid:assembleFullRelease \
            -PcustomSuffix=music -PcustomName='AnkiDroid Music' \
            -Duniversal-apk=true --max-workers=2 --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: AnkiDroid-Music
          path: |
            AnkiDroid/build/outputs/apk/full/release/*.apk
            AnkiDroid/build/test-results/testFullDebugUnitTest/*.xml
            AnkiDroid/build/reports/ktlint/
          if-no-files-found: warn
          retention-days: 30
